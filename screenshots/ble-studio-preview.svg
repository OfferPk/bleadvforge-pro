  <!-- PDU Parameters Box -->
  <g transform="translate(80, 215)">
    <rect x="0" y="0" width="475" height="135" rx="8" fill="#030712" stroke="#1e293b" />
    <text x="15" y="26" font-family="monospace" font-size="12" fill="#94a3b8">PDU Type:            <tspan fill="#00E5FF">ADV_IND (Connectable Undirected)</tspan></text>
    <text x="15" y="50" font-family="monospace" font-size="12" fill="#94a3b8">Advertiser BD_ADDR:  <tspan fill="#7C4DFF">C0:50:43:21:00:15 (Random Static, 11b MSB)</tspan></text>
