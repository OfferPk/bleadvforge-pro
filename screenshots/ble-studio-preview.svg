  <text x="135" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" fill="#f8fafc">BLEAdvForge <tspan fill="#00E5FF">Pro</tspan></text>
  <text x="135" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Bluetooth LE 5.4 Advertising &amp; Beacon Studio &amp; CSS v11 Auditor</text>

