  <text x="95" y="535" font-family="monospace" font-size="11" fill="#cbd5e1">Extended Adv: Up to 255 Bytes on Secondary Channels 0-36</text>
  <text x="95" y="558" font-family="monospace" font-size="11" fill="#cbd5e1">PHY Modes: <tspan fill="#10b981">LE 1M, LE 2M (High Throughput), LE Coded S=8 (1+ km)</tspan></text>
